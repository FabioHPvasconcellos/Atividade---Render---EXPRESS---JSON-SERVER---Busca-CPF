<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CRUD CPF - Início</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 2rem; }
        .menu-options {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-list { background-color: #3498db; }
        .btn-list:hover { background-color: #2980b9; transform: scale(1.05); }
        .btn-add { background-color: #27ae60; }
        .btn-add:hover { background-color: #219150; transform: scale(1.05); }
        .footer { margin-top: 2rem; font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="container">
    <h1>Gerenciamento de Usuários</h1>
    <div class="menu-options">
        <a href="/get/index.html" class="btn btn-list">🔍 Visualizar Cadastros</a>
        <a href="/post/index.html" class="btn btn-add">➕ Cadastrar Novo CPF</a>
    </div>
    <div class="footer">
        Projeto CRUD - Fábio Vasconcellos
    </div>
</div>
</body>
</html>
