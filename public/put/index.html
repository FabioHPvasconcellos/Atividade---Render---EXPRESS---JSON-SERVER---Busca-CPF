<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atualizar Registro</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
    <h1>Editar Registro</h1>
    <input type="text" id="cpfBusca" placeholder="CPF do registro">
    <button onclick="carregarDados()">Carregar Dados</button>

    <form id="formEdit" style="display:none; margin-top:20px;">
        <input type="hidden" id="idEdit">
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="sobrenome" placeholder="Sobrenome">
        <input type="email" id="email" placeholder="Email">
        <button type="button" onclick="salvarAlteracoes()">Salvar Alterações</button>
    </form>
    <p id="mensagem"></p>
    <a href="/">Voltar</a>
</div>
<script src="script.js"></script>
</body>
</html>
