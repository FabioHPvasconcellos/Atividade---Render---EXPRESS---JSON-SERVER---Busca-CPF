<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Registro - CRUD CPF</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>
<div class="container">
    <h1>Editar Cadastro</h1>

    <div class="search-box">
        <input type="text" id="cpfBusca" placeholder="Digite o CPF para editar">
        <button onclick="carregarDados()">Localizar</button>
    </div>

    <form id="formEdit" style="display:none;">
        <h3>Dados Pessoais</h3>
        <div class="form-grid">
            <input type="hidden" id="idEdit">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="sobrenome" placeholder="Sobrenome" required>
            <input type="email" id="email" placeholder="E-mail" class="full-width" required>
            <input type="number" id="idade" placeholder="Idade">
            <input type="text" id="telefone" placeholder="Telefone">
            <input type="text" id="rg" placeholder="RG" class="full-width">
        </div>

        <h3>Endereço</h3>
        <div class="form-grid">
            <input type="text" id="rua" placeholder="Rua" class="full-width">
            <input type="text" id="bairro" placeholder="Bairro">
            <input type="text" id="cidade" placeholder="Cidade">
            <input type="text" id="estado" placeholder="Estado">
            <input type="text" id="cpfInalteravel" readonly title="CPF não pode ser alterado">
        </div>

        <button type="button" onclick="salvarAlteracoes()" style="margin-top: 20px; background-color: #fbbc04; color: black;">
            Confirmar Alterações
        </button>
    </form>

    <p id="mensagem"></p>
    <a href="/">Cancelar e Voltar</a>
</div>
<script src="script.js"></script>
</body>
</html>
