<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - POST</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
    <h1>Novo Registro (POST)</h1>
    <form id="formPost">
        <input type="text" id="nome" placeholder="Nome" required>
        <input type="text" id="sobrenome" placeholder="Sobrenome" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="number" id="idade" placeholder="Idade" required>
        <input type="text" id="telefone" placeholder="Telefone" required>
        <input type="text" id="rua" placeholder="Rua" required>
        <input type="text" id="bairro" placeholder="Bairro" required>
        <input type="text" id="cidade" placeholder="Cidade" required>
        <input type="text" id="estado" placeholder="Estado" required>
        <input type="text" id="cpf" placeholder="CPF (Apenas números)" required>
        <button type="button" onclick="enviarDados()">Cadastrar</button>
    </form>
</div>

<script>
    function enviarDados() {
        const dados = {
            nome: document.getElementById('nome').value,
            sobrenome: document.getElementById('sobrenome').value,
            email: document.getElementById('email').value,
            idade: document.getElementById('idade').value,
            telefone: document.getElementById('telefone').value,
            rua: document.getElementById('rua').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            estado: document.getElementById('estado').value,
            cpf: document.getElementById('cpf').value
        };

        fetch('/api/pessoas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
        .then(res => res.json())
        .then(() => {
            alert('Cadastrado com sucesso!');
            document.getElementById('formPost').reset();
        });
    }
</script>
</body>
</html>
